<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Super Market</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>" />
<style>
:root{--p:#7000ff;--p2:#9b4dff;--bg:#f2f3f7;--t:#14141f;--e:.45s cubic-bezier(.22,.8,.3,1)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(160deg,#efe6ff,#f6f7fb 40%,#e6f0ff);color:var(--t);min-height:100vh}
button{font:inherit;border:0;cursor:pointer;transition:all var(--e)}
input{font:inherit;width:100%;padding:14px 16px;margin:6px 0;border:2px solid #e5e3f0;border-radius:14px;background:#fff;outline:0;transition:border-color var(--e),box-shadow var(--e)}
input:focus{border-color:var(--p);box-shadow:0 0 0 4px #7000ff1f}
.bg{position:fixed;inset:0;overflow:hidden;z-index:-1;pointer-events:none}
.bg span{position:absolute;bottom:-60px;opacity:.13;animation:rise 28s linear infinite}
@keyframes rise{to{transform:translateY(-120vh) rotate(360deg)}}
.splash{position:fixed;inset:0;z-index:99;background:linear-gradient(135deg,#7000ff,#b06bff);display:grid;place-items:center;animation:out .6s 1s forwards}
@keyframes out{to{opacity:0;visibility:hidden;transform:scale(1.1)}}
.logo{display:flex;align-items:center;gap:10px;font-size:46px;color:#fff;animation:pop 1s var(--e)}.logo b{font-size:28px}.logo.big{justify-content:center;color:var(--p);margin:20px 0}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.app{max-width:760px;margin:0 auto;padding:0 14px 110px}
.page{animation:slide .7s var(--e) both}
@keyframes slide{from{opacity:0;transform:translateY(28px) scale(.985);filter:blur(6px)}}
.hero{margin:12px 0;padding:24px 20px;border-radius:26px;color:#fff;background:linear-gradient(135deg,#7000ff,#c04dff 70%,#ff7ab8);position:relative;overflow:hidden;box-shadow:0 16px 40px #7000ff40}
.hero:after{content:'🛒🎁🏷️';position:absolute;right:-8px;top:-10px;font-size:64px;opacity:.2;letter-spacing:6px;transform:rotate(-12deg)}
.hero h1{font-size:26px}.hero p{opacity:.9;margin:6px 0 16px}.search{border:0;margin:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 14px;scrollbar-width:none}
.chips button{white-space:nowrap;padding:10px 16px;border-radius:99px;background:#fff;color:var(--t);box-shadow:0 2px 8px #0001}
.chips button:hover{transform:translateY(-3px);box-shadow:0 8px 18px #7000ff30}.chips .on{background:var(--p);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 4px 16px #1b0f3a14;transition:transform .6s cubic-bezier(.22,.8,.3,1),box-shadow .6s;animation:slide .8s var(--e) both}
.card:hover{transform:translateY(-8px);box-shadow:0 20px 40px #7000ff33}
.img{height:160px;position:relative;display:grid;place-items:center;cursor:pointer;overflow:hidden}
.img.big{height:260px;border-radius:24px}
.em{font-size:76px;transition:transform .7s var(--e);filter:drop-shadow(0 10px 14px #0003)}.big .em{font-size:120px}
.card:hover .em{transform:scale(1.18) rotate(-6deg)}
.off{position:absolute;left:10px;top:10px;background:#ff2d55;color:#fff;font-style:normal;font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px}
.fav{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;background:#fff;color:#999;display:grid;place-items:center}
.fav:hover{transform:scale(1.2);color:#ff2d55}.fav.on{color:#ff2d55}
.info{padding:12px;display:flex;flex-direction:column;gap:3px}
.info h4{font-size:14px;font-weight:600;min-height:36px}.info small{color:#777}.info del{color:#aaa;font-size:12px}.info b{font-size:16px}.info em{font-style:normal;font-size:12px;background:#fff3a8;border-radius:6px;padding:3px 6px;width:fit-content}
.row{display:flex;gap:8px;margin-top:8px}
.btn{display:inline-block;background:var(--p);color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;text-decoration:none;text-align:center}
.btn:hover{background:var(--p2);transform:translateY(-3px);box-shadow:0 10px 22px #7000ff50}.btn:active{transform:scale(.97)}
.btn.ghost{flex:1;background:#f1e8ff;color:var(--p);padding:10px}.btn.ghost:hover{background:var(--p);color:#fff}
.btn.round{width:42px;height:42px;padding:0;display:grid;place-items:center;border-radius:50%}
.btn.full{width:100%;margin-top:12px}.btn.out{background:#ffe5e9;color:#e11d48}.btn.out:hover{background:#e11d48;color:#fff}
.title{display:flex;align-items:center;gap:10px;margin:18px 0 14px;font-size:24px}
.back{width:38px;height:38px;border-radius:50%;background:#fff;font-size:24px;box-shadow:0 2px 8px #0002}.back:hover{background:var(--p);color:#fff;transform:translateX(-4px)}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cat{background:#fff;border-radius:22px;padding:22px 14px;text-align:center;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:all .6s var(--e);box-shadow:0 4px 16px #1b0f3a14}
.cat span{font-size:48px;transition:transform .6s}.cat:hover{transform:translateY(-8px);background:linear-gradient(135deg,#7000ff,#b06bff);color:#fff}.cat:hover span{transform:scale(1.25)}.cat small{opacity:.7}
.detail{display:flex;flex-direction:column;gap:10px}.prices{display:flex;gap:10px;align-items:baseline}.prices b{font-size:26px;color:var(--p)}.prices del{color:#aaa}
.nas{background:#fff8c9;padding:10px 12px;border-radius:12px;font-size:14px}ul{padding-left:20px;line-height:1.8}
.line{display:flex;align-items:center;gap:12px;background:#fff;padding:12px;border-radius:18px;margin-bottom:10px;transition:transform .5s;box-shadow:0 3px 12px #1b0f3a10}.line:hover{transform:translateX(6px)}
.mini{width:62px;height:62px;border-radius:14px;display:grid;place-items:center;font-size:34px}.grow{flex:1}.grow h4{font-size:14px}
.qty{display:flex;align-items:center;gap:10px;background:#f1e8ff;border-radius:99px;padding:4px}.qty button{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--p);font-size:18px}.qty button:hover{background:var(--p);color:#fff}
.box{background:#fff;border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 4px 16px #1b0f3a10}
.seg{display:flex;gap:8px;margin:10px 0}.seg button{flex:1;padding:12px;border-radius:12px;background:#f4f2fa}.seg button:hover{transform:translateY(-2px)}.seg .on{background:var(--p);color:#fff}
.sum{display:flex;justify-content:space-between;font-size:18px;margin-top:10px}
.empty{text-align:center;padding:50px 10px;color:#777;display:flex;flex-direction:column;gap:14px;align-items:center}.empty.sm{padding:14px}.ok{font-size:70px;animation:pop .8s}
.auth{max-width:420px;margin:0 auto}.auth .box{display:flex;flex-direction:column}.auth h3{margin-bottom:6px}.err{color:#e11d48;font-size:14px;margin:6px 0}.sw{text-align:center;margin-top:14px;color:var(--p);cursor:pointer;font-weight:600}
.me{display:flex;gap:14px;align-items:center;margin-top:10px;padding:18px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#7000ff,#c04dff)}.ava{width:60px;height:60px;border-radius:50%;background:#fff;color:var(--p);display:grid;place-items:center;font-size:28px;font-weight:700}
.ord{padding:10px 0;border-bottom:1px solid #eee;font-size:14px;line-height:1.6}
.nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(92%,460px);display:flex;justify-content:space-around;background:#ffffffe6;backdrop-filter:blur(14px);border-radius:26px;padding:8px;box-shadow:0 10px 36px #7000ff3a;z-index:50;margin-bottom:env(safe-area-inset-bottom)}
.ni{position:relative;width:54px;height:48px;display:grid;place-items:center;border-radius:18px;color:#8b8a99;transition:all .5s var(--e)}
.ni:hover{background:#f1e8ff;color:var(--p);transform:translateY(-5px)}.ni.on{background:var(--p);color:#fff;transform:translateY(-8px);box-shadow:0 10px 20px #7000ff55}
.badge{position:absolute;top:2px;right:6px;background:#ff2d55;color:#fff;font-style:normal;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;animation:pop .5s}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
<div id="root"></div>
